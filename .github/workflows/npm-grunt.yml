name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch (e.g., master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a Node.js version compatible with your project

      - name: Install dependencies 📦
        run: npm install --legacy-peer-deps # Add --legacy-peer-deps here

      - name: Build project 🏗️
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch to deploy your static files to
          folder: build # The folder containing your built static files (e.g., 'build' or 'dist')
          # Optionally, if you are deploying to a user/organization page or a custom domain,
          # you might not need to specify a base path in your build configuration,
          # but for project pages, ensure your 'homepage' in package.json is set correctly.
          # For example, if your repository is `my-username/my-repo`, the homepage should be `https://my-username.github.io/my-repo/`
